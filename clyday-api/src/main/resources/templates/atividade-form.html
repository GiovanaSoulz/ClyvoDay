<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClyvoDay - Registrar cuidado</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/atividade-form.css}">

</head>

<body>

<header>

    <h1>🐾 ClyvoDay</h1>

    <a class="voltar"
       href="/pets">
        ← Voltar para Meus Pets
    </a>

</header>

<div class="container">

    <div class="card">

        <h2>Registrar cuidado 🐾</h2>

        <p>
            Registrando cuidado para:
            <strong th:text="${pet.nome}">
                Pet
            </strong>
        </p>

        <form
                action="/atividades/cadastrar"
                method="post"
                th:object="${atividadeDTO}">

            <input type="hidden"
                   name="petId"
                   th:value="${pet.id}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Tipo de cuidado</label>

            <select th:field="*{tipo}" required>

                <option value="">
                    Selecione
                </option>

                <option value="ALIMENTACAO">
                    🍖 Alimentação
                </option>

                <option value="HIDRATACAO">
                    💧 Hidratação
                </option>

                <option value="MEDICACAO">
                    💊 Medicação
                </option>

                <option value="ATIVIDADE">
                    🐕 Atividade física
                </option>

                <option value="CONSULTA">
                    🩺 Consulta
                </option>

                <option value="VACINA">
                    💉 Vacina
                </option>

            </select>
            <span class="erro" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>

            <label>Descrição</label>

            <textarea
                    th:field="*{descricao}"
                    placeholder="Descreva o cuidado..."
                    required></textarea>
            <span class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>

            <label>Data e hora</label>

            <input
                    type="datetime-local"
                    th:field="*{dataHora}">

            <button type="submit">
                Registrar cuidado 🐾
            </button>

        </form>

    </div>

</div>

</body>

</html>
