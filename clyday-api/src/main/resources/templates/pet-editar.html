<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClyvoDay - Editar Pet</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/pet-form.css}">

</head>

<body>

<header>

    <h1>🐾 ClyvoDay</h1>

</header>

<div class="container">

    <div class="card">

        <h2>✏️ Editar pet</h2>

        <div
                class="erro"
                th:if="${erro}"
                th:text="${erro}">
        </div>

        <form
                th:action="@{/pets/{id}/editar(id=${petId})}"
                th:object="${petDTO}"
                method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="nome">
                Nome
            </label>

            <input
                    id="nome"
                    type="text"
                    th:field="*{nome}"
                    required>
            <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

            <label for="especie">
                Espécie
            </label>

            <input
                    id="especie"
                    type="text"
                    th:field="*{especie}"
                    required>
            <span class="erro" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></span>

            <label for="tutorId">
                Tutor
            </label>

            <select
                    id="tutorId"
                    th:field="*{tutorId}"
                    required>

                <option
                        value="">
                    Selecione o tutor
                </option>

                <option
                        th:each="tutor : ${tutores}"
                        th:value="${tutor.id}"
                        th:text="${tutor.nome}">
                </option>

            </select>
            <span class="erro" th:if="${#fields.hasErrors('tutorId')}" th:errors="*{tutorId}"></span>

            <button type="submit">
                💾 Salvar alterações
            </button>

        </form>

        <a
                class="voltar"
                href="/pets">
            ← Voltar para meus pets
        </a>

    </div>

</div>

</body>

</html>
