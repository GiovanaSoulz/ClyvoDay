<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClyvoDay - Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<header>

    <h1>🐾 ClyvoDay</h1>

    <form th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="voltar">Sair</button>
    </form>

</header>

<div class="container">

    <h2>Bem-vindo ao ClyvoDay!</h2>

    <p>
        O diário de cuidado e acompanhamento do seu pet.
    </p>

    <div class="cards">

        <!-- CARD DOS PETS -->

        <div class="card">

            <h2>🐶 Meus Pets</h2>

            <p>
                Visualize seus pets cadastrados.
            </p>

            <a href="/pets">
                Ver meus pets
            </a>

        </div>


        <!-- CARD DOS MEDICAMENTOS -->

        <div class="card">

            <h2>💊 Medicamentos</h2>

            <p>
                Acompanhe os medicamentos do seu pet.
            </p>

            <a href="/medicacoes">
                Ver medicamentos
            </a>

        </div>


        <!-- CARD DO RANKING -->

        <div class="card">

            <h2>🏆 Ranking</h2>

            <p>
                Veja sua pontuação e seu desempenho.
            </p>

            <a href="/ranking">
                Ver ranking
            </a>

        </div>

    </div>

</div>

</body>

</html>
