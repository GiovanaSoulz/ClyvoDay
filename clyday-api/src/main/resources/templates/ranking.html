<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClyvoDay - Ranking</title>

    <link rel="stylesheet"
          th:href="@{/css/global.css}">

    <link rel="stylesheet"
          th:href="@{/css/ranking.css}">

</head>

<body>

<header>

    <h1>🐾 ClyvoDay</h1>

    <a class="voltar"
       href="/dashboard">
        ← Voltar para o Dashboard
    </a>

    <form th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="voltar">Sair</button>
    </form>

</header>


<div class="container">

    <div class="topo">

        <div class="titulo">

            <h2>🏆 Ranking dos Pets</h2>

            <p>
                Acompanhe a pontuação dos seus companheiros.
            </p>

        </div>

    </div>


    <div class="ranking">

        <div class="ranking-card"
             th:each="item, status : ${ranking}">

            <div class="posicao">

                <span th:if="${status.index == 0}">
                    🥇
                </span>

                <span th:if="${status.index == 1}">
                    🥈
                </span>

                <span th:if="${status.index == 2}">
                    🥉
                </span>

                <span th:if="${status.index > 2}"
                      th:text="${status.index + 1}">
                    4
                </span>

            </div>


            <div class="pet-icone">
                🐾
            </div>


            <div class="pet-info">

                <h3 th:text="${item.key.nome}">
                    Luna
                </h3>

                <p th:text="${item.key.especie}">
                    Cachorro
                </p>

            </div>


            <div class="pontuacao">

                <strong th:text="${item.value}">
                    100
                </strong>

                <span>
                    pontos
                </span>

            </div>

        </div>

    </div>


    <div class="vazio"
         th:if="${#lists.isEmpty(ranking)}">

        <h3>🐾 Nenhum pet no ranking</h3>

        <p>
            Cadastre um pet e registre cuidados
            para começar a pontuação.
        </p>

        <a href="/pets">
            Ver meus pets
        </a>

    </div>

</div>

</body>

</html>
