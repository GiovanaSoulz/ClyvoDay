<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClyvoDay - Histórico</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/atividades.css}">

</head>

<body>



<header>

    <h1>🐾 ClyvoDay</h1>

    <a href="/pets" class="voltar">
        ← Voltar para Meus Pets
    </a>

    <form th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="voltar">Sair</button>
    </form>
</header>



<div class="container">

    <h2>
        Histórico de
        <span th:text="${pet.nome}">
            Pet
        </span>
    </h2>

    <a th:href="@{/atividades/nova(petId=${pet.id})}">
        + Registrar cuidado
    </a>

    <div
            th:each="atividade : ${atividades}"
            class="card">

        <h3 th:text="${atividade.tipo}">
            ALIMENTAÇÃO
        </h3>

        <p th:text="${atividade.descricao}">
            Descrição
        </p>

        <p>
            Pontos:
            <span
                    class="pontos"
                    th:text="${atividade.pontos}">
                10
            </span>
        </p>

        <p
                th:text="${atividade.dataHora}">
            Data
        </p>

    </div>

    <div
            th:if="${#lists.isEmpty(atividades)}">

        <p>
            Nenhum cuidado registrado ainda. 🐾
        </p>

    </div>

</div>

</body>

</html>
