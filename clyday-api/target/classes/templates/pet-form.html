<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClyvoDay - Cadastrar Pet</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/pet-form.css}">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="titulo">

            <div class="icone">
                🐾
            </div>

            <h1>Cadastrar Pet</h1>

            <p>
                Adicione um novo companheiro ao ClyvoDay
            </p>

        </div>


        <form action="/pets" th:object="${petDTO}" method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="campo">

                <label for="nome">
                    Nome do pet
                </label>

                <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        placeholder="Ex: Luna"
                        required>
                <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

            </div>


            <div class="campo">

                <label for="especie">
                    Espécie
                </label>

                <input
                        type="text"
                        id="especie"
                        th:field="*{especie}"
                        placeholder="Cachorro, gato..."
                        required>
                <span class="erro" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></span>

            </div>


            <div class="campo">

                <label for="tutorId">
                    Tutor
                </label>

                <select
                        id="tutorId"
                        th:field="*{tutorId}"
                        required>

                    <option value="">
                        Selecione o tutor
                    </option>

                    <option
                            th:each="tutor : ${tutores}"
                            th:value="${tutor.id}"
                            th:text="${tutor.nome}">
                    </option>

                </select>
                <span class="erro" th:if="${#fields.hasErrors('tutorId')}" th:errors="*{tutorId}"></span>

            </div>


            <button
                    class="botao"
                    type="submit">

                Cadastrar Pet 🐾

            </button>


        </form>


        <a
                class="voltar"
                href="/pets">

            ← Voltar para meus pets

        </a>

    </div>

</div>

</body>

</html>
