spring.application.name=clyday-api

spring.datasource.url=jdbc:h2:mem:clyday
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# O Flyway (nao o Hibernate) e quem controla o schema do banco.
# "validate" apenas confere se as entidades JPA batem com o schema
# criado pelas migrations, sem alterar o banco por fora do Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cache.type=simple
